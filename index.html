<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kareem Drammeh · CV</title>

    <!-- Fonts: Archivo for headings, Hanken Grotesk for body text -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Hanken+Grotesk:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!--
      This tiny script runs BEFORE the page paints and BEFORE React loads.
      It reads the theme the user picked last time (saved in localStorage)
      and applies it right away, so returning visitors don't see a flash
      of the light theme before it switches to dark.
    -->
    <script>
      (function () {
        var savedTheme = localStorage.getItem("theme");
        if (savedTheme !== "light") {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
